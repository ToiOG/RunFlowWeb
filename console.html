<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Console Simulado</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #0f1730;
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #fb7185;
      --info: #60a5fa;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 10% 10%, #182353, transparent),
                  radial-gradient(900px 600px at 90% 30%, #1b3a2b, transparent),
                  var(--bg);
      color: var(--text);
      padding: 22px;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 16px;
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .title strong { font-size: 14px; }
    .title span { font-size: 12px; color: var(--muted); }
    .btns { display: flex; gap: 8px; }
    button {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: rgba(255,255,255,.10); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    /* Console */
    #console {
      background: #070b16;
      padding: 14px;
      height: 520px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.45;
    }
    .line { white-space: pre-wrap; word-break: break-word; }
    .line .ts { color: rgba(255,255,255,.38); margin-right: 8px; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .err { color: var(--err); }
    .info { color: var(--info); }
    .muted { color: var(--muted); }

    .prompt {
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(0,0,0,.18);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    .prompt .prefix { color: rgba(255,255,255,.65); }
    .prompt input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      padding: 6px 0;
    }

    /* Editor */
    textarea {
      width: 100%;
      min-height: 520px;
      resize: vertical;
      border: none;
      outline: none;
      background: #0b1226;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      padding: 14px;
      line-height: 1.45;
    }
    .hint {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }
    code.k { color: var(--info); }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- Console -->
    <section class="card">
      <header>
        <div class="title">
          <strong>Console</strong>
          <span>Digite <b>help</b>, <b>run</b> ou <b>clear</b></span>
        </div>
        <div class="btns">
          <button id="btnRun">Run</button>
          <button id="btnStop" disabled>Stop</button>
          <button id="btnClear">Clear</button>
        </div>
      </header>

      <div id="console" aria-label="Console"></div>

      <div class="prompt">
        <span class="prefix">></span>
        <input id="cmd" type="text" placeholder="ex: run" autocomplete="off" />
      </div>
    </section>

    <!-- Editor -->
    <section class="card">
      <header>
        <div class="title">
          <strong>Script (simulado)</strong>
          <span>Comandos: <code class="k">print</code>, <code class="k">wait</code>, <code class="k">error</code>, <code class="k">input</code></span>
        </div>
        <div class="btns">
          <button id="btnLoadDemo">Carregar demo</button>
        </div>
      </header>

      <textarea id="script" spellcheck="false"></textarea>
      <div class="hint">
        Exemplos:
        <br>• <code class="k">print "Olá"</code>
        <br>• <code class="k">wait 400</code> (ms)
        <br>• <code class="k">input nome</code> (pede no prompt do navegador)
      </div>
    </section>
  </div>

  <script>
    const consoleEl = document.getElementById("console");
    const cmdEl = document.getElementById("cmd");
    const scriptEl = document.getElementById("script");
    const btnRun = document.getElementById("btnRun");
    const btnStop = document.getElementById("btnStop");
    const btnClear = document.getElementById("btnClear");
    const btnLoadDemo = document.getElementById("btnLoadDemo");

    let running = false;
    let stopRequested = false;

    function ts() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      const ss = String(d.getSeconds()).padStart(2, "0");
      return `${hh}:${mm}:${ss}`;
    }

    function logLine(text, type = "muted") {
      const line = document.createElement("div");
      line.className = `line ${type}`;
      line.innerHTML = `<span class="ts">${ts()}</span>${escapeHtml(text)}`;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function clearConsole() {
      consoleEl.innerHTML = "";
    }

    function sleep(ms) {
      return new Promise(res => setTimeout(res, ms));
    }

    function setRunning(state) {
      running = state;
      btnRun.disabled = state;
      btnStop.disabled = !state;
      cmdEl.disabled = false; // deixa comandos ok
    }

    function tokenize(line) {
      // aceita: print "texto com espaços" | wait 300 | error "msg" | input varname
      const trimmed = line.trim();
      if (!trimmed) return null;

      // string entre aspas
      const matchQuoted = trimmed.match(/^(\w+)\s+"([\s\S]*)"$/);
      if (matchQuoted) return { op: matchQuoted[1].toLowerCase(), arg: matchQuoted[2] };

      const parts = trimmed.split(/\s+/);
      return { op: parts[0].toLowerCase(), arg: parts.slice(1).join(" ") };
    }

    async function runScript(text) {
      if (running) return;

      stopRequested = false;
      setRunning(true);

      const vars = Object.create(null);
      const lines = text.split(/\r?\n/);

      logLine("Iniciando execução...", "info");

      for (let i = 0; i < lines.length; i++) {
        if (stopRequested) {
          logLine("Execução interrompida.", "warn");
          setRunning(false);
          return;
        }

        const raw = lines[i];
        const t = tokenize(raw);
        if (!t) continue;

        // Mostra "linha atual" como se fosse compilador/runner
        logLine(`L${i + 1}: ${raw}`, "muted");
        await sleep(120); // efeito visual de "tempo real"

        try {
          if (t.op === "print") {
            // substitui {variavel} no texto
            const rendered = t.arg.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ""));
            logLine(rendered, "ok");
          } else if (t.op === "wait") {
            const ms = Number(t.arg);
            if (!Number.isFinite(ms) || ms < 0) throw new Error("wait precisa de um número (ms).");
            await sleep(ms);
          } else if (t.op === "error") {
            throw new Error(t.arg || "Erro simulado.");
          } else if (t.op === "input") {
            const name = (t.arg || "").trim();
            if (!name) throw new Error("input precisa do nome da variável. Ex: input nome");
            const val = prompt(`Digite um valor para ${name}:`) ?? "";
            vars[name] = val;
            logLine(`(input) ${name} = "${val}"`, "info");
          } else if (t.op === "set") {
            // extra: set var valor
            // ex: set idade 20
            const [k, ...rest] = (t.arg || "").split(/\s+/);
            if (!k) throw new Error("set precisa de variável. Ex: set x 10");
            vars[k] = rest.join(" ");
            logLine(`(set) ${k} = "${vars[k]}"`, "info");
          } else {
            logLine(`Comando desconhecido: ${t.op}`, "warn");
          }
        } catch (e) {
          logLine(`Erro na linha ${i + 1}: ${e.message}`, "err");
          setRunning(false);
          return;
        }
      }

      logLine("Execução finalizada com sucesso.", "info");
      setRunning(false);
    }

    function handleCommand(cmd) {
      const c = cmd.trim().toLowerCase();
      if (!c) return;

      logLine(`> ${cmd}`, "info");

      if (c === "help") {
        logLine("Comandos: help | run | clear | stop", "muted");
        logLine('Script: print "texto" | wait 300 | input nome | error "msg" | set x 10', "muted");
      } else if (c === "clear") {
        clearConsole();
      } else if (c === "run") {
        runScript(scriptEl.value);
      } else if (c === "stop") {
        stopRequested = true;
      } else {
        logLine(`Comando não reconhecido: ${cmd}`, "warn");
      }
    }

    // UI events
    btnRun.addEventListener("click", () => runScript(scriptEl.value));
    btnStop.addEventListener("click", () => stopRequested = true);
    btnClear.addEventListener("click", clearConsole);

    cmdEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const v = cmdEl.value;
        cmdEl.value = "";
        handleCommand(v);
      }
    });

    btnLoadDemo.addEventListener("click", () => {
      scriptEl.value = [
        'print "=== Simulação de execução ==="', 
        'print "Olá! Digite seu nome:"',
        'input nome',
        'print "Bem-vindo, {nome}!"',
        'wait 500',
        'set curso ADS',
        'print "Curso: {curso}"',
        'wait 400',
        'print "Processando..."',
        'wait 800',
        'print "Finalizado ✅"'
      ].join("\n");
      logLine("Demo carregada no editor. Digite run.", "info");
    });

    // boot
    btnLoadDemo.click();
    logLine("Console pronto. Digite help.", "info");
  </script>
</body>
</html>
